<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my_dbms</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --card: #fff; --line: #ddddd8; --accent: #2f6f4f; --err: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #e8e8e4; --muted: #9a9a94; --card: #20201e; --line: #34342f; --accent: #6cc196; --err: #f2867d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p { margin: 0 0 20px; color: var(--muted); }
  label { display: block; margin-bottom: 4px; font-size: 13px; color: var(--muted); }
  input, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
                    background: var(--card); color: var(--fg); font: 14px/1.5 ui-monospace, Consolas, monospace; }
  input { margin-bottom: 14px; }
  textarea { min-height: 130px; resize: vertical; }
  button { margin-top: 10px; padding: 9px 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--bg);
           font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .hint { margin-left: 10px; color: var(--muted); font-size: 13px; }
  #out { margin-top: 24px; }
  .item { margin-bottom: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cmd { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--accent); font: 13px ui-monospace, Consolas, monospace; }
  .body { padding: 12px; overflow-x: auto; }
  pre { margin: 0; font: 13px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  .error pre { color: var(--err); }
  table { border-collapse: collapse; font-size: 14px; }
  th, td { padding: 4px 12px; border-bottom: 1px solid var(--line); text-align: left; }
  th small { color: var(--muted); font-weight: normal; }
  .null { color: var(--muted); font-style: italic; }
  .count { margin-top: 8px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>my_dbms</h1>
  <p>Banco de dados relacional escrito do zero em Go. Um comando SQL por linha.</p>

  <label for="server">Servidor</label>
  <input id="server" value="http://localhost:4321">

  <label for="sql">SQL</label>
  <textarea id="sql" spellcheck="false">CREATE TABLE pessoas (id INT PRIMARY KEY, nome TEXT);
INSERT INTO pessoas VALUES (1, 'Ana'), (2, 'Bruno');
SELECT * FROM pessoas;</textarea>
  <button id="run">Executar</button><span class="hint">Ctrl+Enter</span>

  <div id="out"></div>
</main>
<script>
  const server = document.getElementById("server");
  const sql = document.getElementById("sql");
  const btn = document.getElementById("run");
  const out = document.getElementById("out");

  // Entregue pelo próprio servidor, a página fala com quem a entregou.
  if (location.protocol.startsWith("http")) server.value = location.origin;

  async function run() {
    const lines = sql.value.split("\n").map(l => l.trim()).filter(Boolean);
    if (!lines.length) return;
    btn.disabled = true;
    out.innerHTML = "";
    const url = server.value.trim().replace(/\/+$/, "") + "/sql";
    for (const line of lines) {
      try {
        const res = await fetch(url, { method: "POST", body: line });
        show(line, await res.json());
      } catch (e) {
        show(line, { error: "sem resposta do servidor (" + e.message + ")" });
        break;
      }
    }
    btn.disabled = false;
  }

  // show desenha a resposta: tabela para SELECT, texto para o resto.
  function show(cmd, data) {
    const item = el("div", "item" + (data.error ? " error" : ""));
    item.append(el("div", "cmd", cmd));
    const body = el("div", "body");
    if (data.columns) {
      body.append(table(data.columns, data.rows || []));
      const n = (data.rows || []).length;
      body.append(el("div", "count", n + (n === 1 ? " linha" : " linhas")));
    } else {
      body.append(el("pre", "", data.error || data.output || "ok"));
    }
    item.append(body);
    out.append(item);
  }

  function table(columns, rows) {
    const t = el("table");
    const head = el("tr");
    for (const c of columns) {
      const th = el("th", "", c.name + " ");
      th.append(el("small", "", c.type));
      head.append(th);
    }
    t.append(head);
    for (const row of rows) {
      const tr = el("tr");
      for (const v of row) tr.append(v === null ? el("td", "null", "NULL") : el("td", "", v));
      t.append(tr);
    }
    return t;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  btn.addEventListener("click", run);
  sql.addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) run(); });
</script>
</body>
</html>
