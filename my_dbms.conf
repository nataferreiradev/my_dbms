# Parâmetros do my_dbms, no formato "chave = valor".
# Linhas começadas com # são comentários.

# Pasta onde ficam os arquivos das tabelas (.mari). Caminho relativo é
# resolvido a partir da pasta onde o programa roda.
data_dir = data

# Tamanho das páginas dos arquivos, em bytes: potência de 2 entre 1024 e
# 32768. Fica gravado no banco quando ele é criado, e abrir um banco
# existente com outro valor é erro. Um registro precisa caber numa página.
page_size = 4096

# API de embeddings dos índices vetoriais (CREATE VECTOR INDEX e WITH
# EMBEDDING): o endereço base, no formato da OpenAI, e o modelo. Vazio
# desliga. O jeito fácil de preencher é rodar: go run ./cmd/my_dbms -setup
# A chave da API nunca fica aqui (este arquivo vai para o git): o -setup a
# guarda no arquivo de credenciais do usuário, e MY_DBMS_API_KEY vale mais.
# embedding_url = http://localhost:11434/v1
# embedding_model = nomic-embed-text
